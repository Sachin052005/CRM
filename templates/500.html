{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong - TECHPANDA CRM</title>
  <link rel="stylesheet" href="{% static 'css/crm.css' %}">
</head>
<body style="background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: var(--font-family);">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 40px; max-width: 420px; text-align: center;">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">⚠️</div>
    <h1 style="font-size: 1.35rem; color: var(--text-main); margin: 0 0 8px;">Something Went Wrong</h1>
    <p style="color: var(--text-muted); font-size: 0.925rem; margin: 0 0 24px;">
      An unexpected error occurred. Please try again, or contact support if the problem continues.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="display: inline-block; text-decoration: none;">Back to Login</a>
  </div>
</body>
</html>
