{% extends 'base.html' %}
{% block title %}Password Reset Sent - TECHPANDA CRM{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); text-align: center;">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: var(--radius-md); background: #dcfce7; color: #15803d; margin-bottom: 16px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </div>
    <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Check Your Email</h2>
    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 24px; line-height: 1.5;">
      If an account exists with the email you entered, we've sent password reset instructions. Please check your inbox (and spam folder).
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="display: block; width: 100%; padding: 10px; font-weight: 600; text-decoration: none;">Return to Login</a>
  </div>
</div>
{% endblock %}
