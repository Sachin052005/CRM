{% extends 'base.html' %}
{% block title %}Reset Password - TECHPANDA CRM{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--primary-light); color: var(--primary); margin-bottom: 12px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--text-main);">Reset Password</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Enter your email address and we'll send you instructions to reset your password.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; color: var(--text-main);">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="Enter your registered email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-weight: 600;">Send Reset Link</button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.825rem;">
      <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
