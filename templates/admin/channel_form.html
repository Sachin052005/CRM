{% extends 'base.html' %}
{% block title %}Edit Channel - TECHPANDA CRM{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title-group">
    <h1>Edit Channel</h1>
    <p>Update channel name or active availability status</p>
  </div>
  <div class="page-actions">
    <a href="{% url 'admin_channels_list' %}" class="btn btn-secondary">Back to Channels</a>
  </div>
</div>

<div style="max-width: 500px;">
  <div class="crm-card">
    <div class="crm-card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Channel Name <span class="required">*</span></label>
          {{ form.name }}
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          {{ form.status }}
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <a href="{% url 'admin_channels_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
